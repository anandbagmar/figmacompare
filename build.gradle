buildscript {
    ext {
        gradleVersion = '9.3.1'
    }
    repositories {
        mavenLocal()
    }
}

plugins {
    id "java"
    id "maven-publish"
}

// JitPack builds this project with `-Pgroup=com.github.<owner> -Pversion=<tag>` (its own
// convention - see docs.jitpack.io) and expects publishToMavenLocal to publish under
// exactly that coordinate - respect it when present. Otherwise (our own local dev loop,
// ./gradlew publishToMavenLocal with no -P overrides) default to io.eot/0.0.1-local as
// before. That mismatch between the Java package namespace (io.eot.figmacompare) and a
// real release's Maven coordinate (com.github.anandbagmar:figmacompare) is intentional -
// JitPack's groupId is a hosting/packaging artifact, unrelated to the code's own
// namespace - see README.md's "Publishing a release" section.
//
// project.findProperty('version')/'group' can't distinguish "-P given" from "not given" -
// Gradle's Project always has a built-in version default of the literal string
// "unspecified" (truthy, so `?:` never falls through) - gradle.startParameter's own
// projectProperties map is unaffected by that default and only reflects real -P flags.
def cliProps = gradle.startParameter.projectProperties
group = cliProps.group ?: 'io.eot'
// -PpublishVersion is this project's own release workflow's convention (used only to
// stamp the jar's Implementation-Version/filename when building a GitHub Release asset -
// see .github/workflows/publish.yml); -Pversion is JitPack's. Neither given -> local dev.
version = cliProps.version ?: (cliProps.publishVersion ?: '0.0.1-local')

repositories {
    mavenLocal()
    mavenCentral()
}

compileJava { options.encoding = "UTF-8" }

// Lets AppConfig.libraryVersion() read this back at runtime via
// getPackage().getImplementationVersion() - only populated when running from the built
// jar (i.e. as a real consumer dependency), not from raw .class files in an IDE/test run.
jar {
    manifest {
        attributes(
            "Implementation-Title": "figmacompare",
            "Implementation-Version": project.version
        )
    }
}

dependencies {
    // A regular (non-enforced) platform, since enforcedPlatform shouldn't be published -
    // it would force this exact Selenium version on every consumer, overriding their own.
    implementation platform("org.seleniumhq.selenium:selenium-bom:4.46.0")
    implementation "com.applitools:eyes-images-java5:5.81.35"
    implementation ("com.applitools:eyes-appium-java5:5.79.35") {
        exclude group: 'io.appium', module: 'java-client'
    }
    implementation "io.appium:java-client:10.1.1"
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'org.apache.poi:poi-ooxml:5.4.0'

    // Only used by this project's own unit tests below - never leaks to a consumer of
    // the published artifact.
    testImplementation 'org.testng:testng:7.12.0'
}

test {
    useTestNG()
    testLogging {
        events "started", "passed", "skipped", "failed"
        showStandardStreams = true
        exceptionFormat = 'full'
        showStackTraces = true
        showCauses = true
        showExceptions = true
    }
}

// mavenLocal() only - for everyday local-dev iteration (./gradlew publishToMavenLocal).
// Real releases are never pushed anywhere by this project - JitPack builds them directly
// from this repo's tags on demand, see .github/workflows/publish.yml and README.md's
// "Publishing a release" section.
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}

// "publishToMavenLocal" (the lifecycle task, unlike "publishAllPublicationsTo
// MavenLocalRepository") depends on this one specifically - the built-in alias task
// without "Repository" in the name - not the generically-generated one.
tasks.named("publishMavenJavaPublicationToMavenLocal") {
    doLast {
        println()
        println "Published ${project.group}:${project.name}:${project.version} to mavenLocal (~/.m2/repository)."
        println "To use it from figmacompare-sample, run there with:"
        println "    -PfigmacompareVersion=${project.version}"
        println()
    }
}

wrapper {
    gradleVersion = project.gradleVersion
}
