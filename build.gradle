buildscript {
    ext {
        gradleVersion = '9.3.1'
    }
    repositories {
        mavenLocal()
    }
}

plugins {
    id "java"
    id "maven-publish"
}

group = 'io.eot'
// Real releases pass -PpublishVersion=<version> (see .github/workflows/publish.yml,
// which derives it from the GitHub Release tag) - this default is only ever used for
// everyday `./gradlew publishToMavenLocal` local-dev iteration, never published anywhere.
version = project.findProperty('publishVersion') ?: '0.0.1-local'

repositories {
    mavenLocal()
    mavenCentral()
}

compileJava { options.encoding = "UTF-8" }

// Lets AppConfig.libraryVersion() read this back at runtime via
// getPackage().getImplementationVersion() - only populated when running from the built
// jar (i.e. as a real consumer dependency), not from raw .class files in an IDE/test run.
jar {
    manifest {
        attributes(
            "Implementation-Title": "figmacompare",
            "Implementation-Version": project.version
        )
    }
}

dependencies {
    // A regular (non-enforced) platform, since enforcedPlatform shouldn't be published -
    // it would force this exact Selenium version on every consumer, overriding their own.
    implementation platform("org.seleniumhq.selenium:selenium-bom:4.46.0")
    implementation "com.applitools:eyes-images-java5:5.81.35"
    implementation ("com.applitools:eyes-appium-java5:5.79.35") {
        exclude group: 'io.appium', module: 'java-client'
    }
    implementation "io.appium:java-client:10.1.1"
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'org.apache.poi:poi-ooxml:5.4.0'

    // Only used by this project's own unit tests below - never leaks to a consumer of
    // the published artifact.
    testImplementation 'org.testng:testng:7.12.0'
}

test {
    useTestNG()
    testLogging {
        events "started", "passed", "skipped", "failed"
        showStandardStreams = true
        exceptionFormat = 'full'
        showStackTraces = true
        showCauses = true
        showExceptions = true
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
        // Real releases only - see .github/workflows/publish.yml. Consuming this
        // requires a GitHub token with read:packages (this repo is private), even once
        // the repo itself is public - GitHub Packages' Maven registry always requires
        // authentication to consume, unlike its npm registry.
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/anandbagmar/figmacompare")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

// "publishToMavenLocal" (the lifecycle task, unlike "publishAllPublicationsTo
// MavenLocalRepository") depends on this one specifically - the built-in alias task
// without "Repository" in the name - not the generically-generated one.
tasks.named("publishMavenJavaPublicationToMavenLocal") {
    doLast {
        println()
        println "Published ${project.group}:${project.name}:${project.version} to mavenLocal (~/.m2/repository)."
        println "To use it from figmacompare-sample, run there with:"
        println "    -PfigmacompareVersion=${project.version}"
        println()
    }
}

wrapper {
    gradleVersion = project.gradleVersion
}
